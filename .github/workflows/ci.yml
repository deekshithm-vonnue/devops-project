name: CI

on: 
  push:
      branches: [main]
  pull_request:
      branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
     - name: Checkout code
       uses: actions/checkout@v4

     - name: Set up Node.js 
       uses: actions/setup-node@v4
       with:
          node-version: 24
          cache: npm
     - name: Install dependencies
       run: npm ci 
     - name: Builit id TypeScript
       run: npm run build
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t deveops-project:ci