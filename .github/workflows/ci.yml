name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build TypeScript
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

  docker-build:
    name: Build and publish Docker image
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/deekshithm-vonnue/devops-project:${{ github.sha }}
            ghcr.io/deekshithm-vonnue/devops-project:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  runner-test:
    name: Test self-hosted runner
    needs: [build, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted

    steps:
      - name: Verify runner environment
        run: |
          echo "Running on the local self-hosted runner"
          hostname
          uname -a
          docker --version
          docker compose version
          docker info --format '{{.ServerVersion}}'

  deploy:
    name: Deploy Blue-Green
    needs: [build, docker-build, runner-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted

    # Do not run overlapping deployments.
    concurrency:
      group: blue-green-production
      cancel-in-progress: false

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy new image
        env:
          IMAGE_TAG: ${{ github.sha }}
          DEPLOY_DIR: /home/deekshith.m/devops-project
          COMPOSE_FILE: ${{ github.workspace }}/compose.blue-green.yaml
        run: |
          bash "$GITHUB_WORKSPACE/deploy-blue-green.sh"
  
  deploy-ec2:
    name: Deploy to AWS EC2
    needs: [build, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted

    concurrency:
      group: ec2-blue-green-production
      cancel-in-progress: false

    env:
      EC2_HOST: ${{ vars.EC2_HOST }}
      EC2_USER: ec2-user
      EC2_SSH_KEY: /home/deekshith/.ssh/trail.pem
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Deploy to EC2 through SSH
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Checking EC2_HOST..."
          test -n "$EC2_HOST" || {
            echo "ERROR: EC2_HOST is empty"
            exit 1
          }

          echo "Checking SSH private key..."
          test -f "$EC2_SSH_KEY" || {
            echo "ERROR: SSH key not found: $EC2_SSH_KEY"
            exit 1
          }

          echo "Checking SSH key permissions..."
          chmod 600 "$EC2_SSH_KEY"

          echo "Connecting to EC2: $EC2_HOST"

          ssh -vv \
            -i "$EC2_SSH_KEY" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$EC2_USER@$EC2_HOST" \
            "cd /home/ec2-user/devops-project && IMAGE_TAG='$IMAGE_TAG' bash ./deploy-blue-green.sh"
