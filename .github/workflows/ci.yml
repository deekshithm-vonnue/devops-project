name: CI

on: 
  push:
      branches: [main]
  pull_request:
      branches: [main]

jobs:
  build:
    run-on: ubuntu-lastest

    steps:
     - name: Checkout code
       uses: actions/checkout@v4

     - name: Set up Node.js 
       uses: actions/setup-node@v4
       with:
          node-version: 24
          cache: npm
     - name: Install dependencies
       run: npm ci 
     - name: Build TypeScript
       run: npm run build